[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "win-process-tuner"
version = "0.2.0"
description = "Windows process tuning CLI (priority, affinity, timer resolution)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "negg0s" }
]
keywords = ["windows", "process", "tuning", "priority", "affinity", "timer-resolution", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/negg0s/win-process-tuner"
Repository = "https://github.com/negg0s/win-process-tuner.git"
Issues = "https://github.com/negg0s/win-process-tuner/issues"

[project.scripts]
win-process-tuner = "win_process_tuner.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "win-process-tuner"
version = "0.1.0"
description = "Windows process tuning CLI (priority, affinity, timer resolution)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "click>=8.0",
    "psutil>=5.9",
]

[project.scripts]
win-process-tuner = "win_process_tuner.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"